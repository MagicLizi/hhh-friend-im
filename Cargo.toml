[workspace]
# 根目录是插件程序；core 是两边共用的部分，client 是连服务器的客户端库。
members = ["core", "client"]
resolver = "3"

[package]
name = "friend-im"
version = "0.4.3"
edition = "2024"
publish = false
license = "MIT"
description = "Cindy IM：端到端加密的 HHH IM 插件"

# 库里是协议服务（测试在进程内驱动它），程序只是把它接到标准输入输出上。
[lib]
name = "friend_im"
path = "src/lib.rs"

[[bin]]
name = "friend-im"
path = "src/main.rs"

[dependencies]
# 连服务器、核对、加解密都在客户端库里；插件只把它翻成 HHH 的插件协议。
friend-im-client = { path = "client" }
# 协议包：固定已发布标签，支持宿主交本机用户头像（account/avatar，协议 v35）。
hhh-im-protocol = { git = "https://github.com/MagicLizi/hhh-im-sdk", tag = "v0.14.0" }
# 异步运行时：读标准输入、并发处理宿主的请求、推送队列。
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 资源与上传的数据按协议写成标准 base64；上传的摘要用 sha256 核对。
base64 = "0.22"
sha2 = "0.11"
# 日志交给宿主（log/write）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
# 发图片时读宽高（只读文件头，不解码图片）。
imagesize = "0.14"
# 取头像（Cindy 头像地址，第三阶段）用客户端库的 `web`（原生是 reqwest，WASI 构建是同名接口的小实现），不另外依赖。

# WASI 构建（wasm32-wasip2，手机上由宿主解释执行）：tokio 在 WASI 上没有后台线程，它的标准输入输出用不了，
# 改用 WASI 的非阻塞读写（`src/wasi_stdio.rs`）。
[target.'cfg(target_os = "wasi")'.dependencies]
wasip2 = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
